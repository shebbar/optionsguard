[server]
port = 8787

[pricing]
risk_free_rate = 0.065    # SET to current 91-day T-bill yield, e.g. 0.065
trading_days_per_year = 252

[defaults]                # seeds the first settings row
max_loss_per_trade = 5000
monthly_loss_limit = 10000
premium_stop_pct = 0.40
time_stop_days = 7
cooloff_days = 10
charges_per_order_estimate = 60

[verdict]
low_prob_red = 0.25
low_prob_amber = 0.35
be_to_move_red = 0.8
chasing_5d_pct = 0.08
chasing_20dma_pct = 0.07
iv_hv_amber = 1.3
hv_pct_amber = 80
spread_red = 0.10
spread_amber = 0.05
min_volume = 50
min_oi = 200
near_expiry_days = 8

[holidays]
# NSE trading holidays, "YYYY-MM-DD", user-maintained
dates = [
    "2026-01-26",
    "2026-01-15",
    "2026-01-26",
    "2026-03-03",
    "2026-03-26",
    "2026-03-31",
    "2026-04-03",
    "2026-04-14",
    "2026-05-01",
    "2026-05-28",
    "2026-06-26",
    "2026-08-15",
    "2026-09-14",
    "2026-10-02",
    "2026-10-20",
    "2026-11-10",
    "2026-11-24",
    "2026-12-25",
]

[market_data]
# "mock" | "manual_only" | "kite"  -- selects the default source used by /checks
# when the caller doesn't say. v1 default is "mock" since Kite keys aren't set up yet.
default_source = "mock"
