[project]
name = "optionguard"
version = "0.1.0"
description = "Local pre-trade risk and journal tool for NSE stock options"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "numpy>=2.1",
    "scipy>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "kiteconnect>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
optionguard = "optionguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optionguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
