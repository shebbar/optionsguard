<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OptionGuard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <nav>
    <a href="/" class="{{ 'active' if active=='check' else '' }}">Check</a>
    <a href="/positions" class="{{ 'active' if active=='positions' else '' }}">Positions</a>
    <a href="/journal" class="{{ 'active' if active=='journal' else '' }}">Journal</a>
    <a href="/settings" class="{{ 'active' if active=='settings' else '' }}">Settings</a>
  </nav>
  <div id="statusbar" hx-get="/status-html" hx-trigger="load" hx-swap="innerHTML"></div>
  {% block content %}{% endblock %}
</body>
</html>
